    <meta name="theme-color" content="#2b060a" />
    <script>
      // Restore appearance before styles and the first route are painted.
      try {
        const requestedTone = new URLSearchParams(location.search).get('tone');
        const savedTone = localStorage.getItem('shoditsa:study:theme');
        if (requestedTone === 'dark' || (requestedTone !== 'light' && savedTone === 'dark')) document.documentElement.dataset.questTone = 'dark';
        if (document.documentElement.dataset.questSkin === 'shoditsa') document.querySelector('meta[name="theme-color"]')?.setAttribute('content', document.documentElement.dataset.questTone === 'dark' ? '#1a191b' : '#fdfcfd');
      } catch { /* Storage can be unavailable; the app still restores its default. */ }
    </script>
