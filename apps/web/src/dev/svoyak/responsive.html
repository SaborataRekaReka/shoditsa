<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Свояк — проверка 390 и 320</title></head>
<body style="margin:16px;font:14px Arial;background:#eee">
  <div style="display:grid;grid-template-columns:390px 320px;align-items:start;gap:24px">
    <section><h2>390 × 844</h2><iframe title="Свояк на ширине 390" src="/shoditsa-svoyak.html?demo=board" style="display:block;width:390px;height:844px;border:0"></iframe></section>
    <section><h2>320 × 844</h2><iframe title="Свояк на ширине 320" src="/shoditsa-svoyak.html?demo=board" style="display:block;width:320px;height:844px;border:0"></iframe></section>
    <section><h2>Ответ 390 × 844</h2><iframe title="Ответ на ширине 390" src="/shoditsa-svoyak.html?demo=board&amp;role=host&amp;screen=answer" style="display:block;width:390px;height:844px;border:0"></iframe></section>
    <section><h2>Ответ 320 × 844</h2><iframe title="Ответ на ширине 320" src="/shoditsa-svoyak.html?demo=board&amp;role=host&amp;screen=answer" style="display:block;width:320px;height:844px;border:0"></iframe></section>
    <section style="grid-column:1/-1"><h2>Шелл 1001 × 844</h2><iframe title="Шелл на ширине 1001" src="/shoditsa-svoyak.html?demo=board" style="display:block;width:1001px;height:844px;border:0"></iframe></section>
    <section style="grid-column:1/-1"><h2>Шелл 1440 × 844</h2><iframe title="Шелл на ширине 1440" src="/shoditsa-svoyak.html?demo=board" style="display:block;width:1440px;height:844px;border:0"></iframe></section>
  </div>
  <pre id="checks" style="white-space:pre-wrap"></pre>
  <script>
    const reports = {};
    for (const frame of document.querySelectorAll('iframe')) frame.addEventListener('load', async () => {
      const page = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!doc?.documentElement) return;
      if (!doc.querySelector('.svoyak-room')) await new Promise(resolve => {
        const observer = new page.MutationObserver(() => {
          if (doc.querySelector('.svoyak-room')) { observer.disconnect(); resolve(); }
        });
        observer.observe(doc, { childList: true, subtree: true });
      });
      await doc.fonts.ready;
      page.requestAnimationFrame(() => page.requestAnimationFrame(() => {
        const cells = Array.from(doc.querySelectorAll('.question-price-button'));
        const players = doc.querySelector('.svoyak-room__players');
        const cards = Array.from(doc.querySelectorAll('.svoyak-person'));
        const aside = doc.querySelector('.study-right-panel');
        const board = doc.querySelector('.svoyak-board');
        reports[`${frame.title} — шелл`] = { rightPanelVisible: page.getComputedStyle(aside).display !== 'none', rightPanelState: aside.dataset.studyRight, mainWidth: doc.querySelector('.svoyak-main').clientWidth, boardFits: !board || board.scrollWidth <= board.clientWidth, accountWidgets: doc.querySelectorAll('.study-right-panel [data-study-widget]').length };
        reports[`${frame.title} — карточки`] = { sameRow: new Set(cards.map(card => Math.round(card.getBoundingClientRect().top))).size === 1, count: cards.length, viewportWidth: players.clientWidth, scrollWidth: players.scrollWidth, horizontalScroll: page.getComputedStyle(players).overflowX };
        reports[frame.title] = { width: page.innerWidth, contentWidth: doc.documentElement.scrollWidth, priceButtons: cells.length, smallestTarget: cells.length ? Math.min(...cells.map(cell => cell.getBoundingClientRect().width)) : null, room: Boolean(doc.querySelector('.svoyak-room')), playersInsideRoom: Boolean(doc.querySelector('.svoyak-room .svoyak-company')), actionStrip: Boolean(doc.querySelector('.svoyak-actionbar')), disabledMainActions: doc.querySelectorAll('.svoyak-actions button:disabled').length, roomNameRemoved: !doc.body.textContent.includes('КОТЫ'), answerHasNoCard: !doc.querySelector('.svoyak-answer') || page.getComputedStyle(doc.querySelector('.svoyak-answer')).backgroundColor === 'rgba(0, 0, 0, 0)', stageColor: page.getComputedStyle(doc.querySelector('.svoyak-stage')).backgroundColor, playersColor: page.getComputedStyle(doc.querySelector('.svoyak-room__players')).backgroundColor };
        document.getElementById('checks').textContent = JSON.stringify(reports, null, 2);
      }));
    });
  </script>
</body>
</html>
